<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="Learned control converging on the expert envelope, and the transfer chain by which the same loop packages the next airframe"><defs><marker id="ec-ink" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#C7C4BD"/></marker><marker id="ec-red" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#F04B4B"/></marker><marker id="ec-grey" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#414141"/></marker></defs><text x="70.0" y="40.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" letter-spacing="0.13em">THE LOOP CLOSES</text><text x="70.0" y="58.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.5" fill="#7F7C76" letter-spacing="0.08em">FRACTION OF THE PHYSICAL ENVELOPE RECOVERED</text><line x1="70.0" y1="104.0" x2="70.0" y2="330.0" stroke="#2B2B2B" stroke-width="1"/><line x1="70.0" y1="330.0" x2="540.0" y2="330.0" stroke="#2B2B2B" stroke-width="1"/><text x="305.0" y="372.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" text-anchor="middle" letter-spacing="0.12em">FLIGHT CAMPAIGNS</text><line x1="70.0" y1="132.0" x2="540.0" y2="132.0" stroke="#F04B4B" stroke-width="1.4" stroke-dasharray="7 5"/><text x="540.0" y="122.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.0" fill="#F04B4B" text-anchor="end">expert envelope — what the aircraft can actually do</text><line x1="80.0" y1="310.0" x2="260.0" y2="310.0" stroke="#7F7C76" stroke-width="1.4" stroke-dasharray="4 4"/><text x="270.0" y="314.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.0" fill="#7F7C76">conventional autonomy</text><polyline points="70.0,310.0 150.0,262.0 230.0,224.0 310.0,194.0 390.0,172.0 470.0,156.0 540.0,146.0" fill="none" stroke="#C7C4BD" stroke-width="2"/><circle cx="70.0" cy="310.0" r="3.6" fill="#D92323"/><circle cx="150.0" cy="262.0" r="3.6" fill="#D92323"/><circle cx="230.0" cy="224.0" r="3.6" fill="#D92323"/><circle cx="310.0" cy="194.0" r="3.6" fill="#D92323"/><circle cx="390.0" cy="172.0" r="3.6" fill="#D92323"/><circle cx="470.0" cy="156.0" r="3.6" fill="#D92323"/><circle cx="540.0" cy="146.0" r="3.6" fill="#D92323"/><text x="548.0" y="158.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#C7C4BD" text-anchor="end" font-weight="700">learned control</text><text x="70.0" y="372.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.0" fill="#7F7C76">Each mark is one flight campaign: one identification pass, one simulator correction, one retrain. The loop</text><text x="70.0" y="388.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.0" fill="#7F7C76">closes when the policy matches the expert in reality and the twin predicts the flight.</text><line x1="620.0" y1="30.0" x2="620.0" y2="430.0" stroke="#1D1D1D" stroke-width="1"/><text x="650.0" y="40.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" letter-spacing="0.12em">WHAT TRAVELS TO THE NEXT AIRFRAME</text><rect x="650.0" y="58.0" width="310.0" height="62.0" fill="#050505" stroke="#414141" stroke-width="1"/><text x="805.0" y="87.5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.8" fill="#C7C4BD" text-anchor="middle" font-weight="600">RESEARCH QUAD</text><text x="805.0" y="97.8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="6.8" fill="#A19E97" text-anchor="middle">instrumented, cheap to fly, cheap to crash — where the loop is proven</text><line x1="805.0" y1="120.0" x2="805.0" y2="142.0" stroke="#C7C4BD" stroke-width="1.1" marker-end="url(#ec-ink)"/><rect x="650.0" y="142.0" width="310.0" height="62.0" fill="#3A1212" stroke="#D92323" stroke-width="1.3"/><text x="805.0" y="166.9" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.8" fill="#F2EFE9" text-anchor="middle" font-weight="600">HIGH-SPEED PLATFORM</text><text x="805.0" y="177.2" font-family="JetBrains Mono, ui-monospace, monospace" font-size="6.8" fill="#A19E97" text-anchor="middle">a 500</text><text x="805.0" y="186.5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="6.8" fill="#A19E97" text-anchor="middle">km/h airframe flown autonomously at 300 km/h — new package, same loop</text><line x1="805.0" y1="204.0" x2="805.0" y2="226.0" stroke="#C7C4BD" stroke-width="1.1" marker-end="url(#ec-ink)"/><rect x="650.0" y="226.0" width="310.0" height="62.0" fill="#050505" stroke="#414141" stroke-width="1"/><text x="805.0" y="255.5" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.8" fill="#C7C4BD" text-anchor="middle" font-weight="600">PRODUCTION AIRCRAFT</text><text x="805.0" y="265.8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="6.8" fill="#A19E97" text-anchor="middle">the same twin, policies and evidence, commissioned for the customer</text><text x="650.0" y="336.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.5" fill="#F04B4B" font-weight="700" letter-spacing="0.1em">WHAT TRAVELS WITH IT</text><rect x="650.0" y="350.0" width="150.0" height="28.0" fill="#050505" stroke="#414141" stroke-width="1"/><text x="725.0" y="366.4" font-family="JetBrains Mono, ui-monospace, monospace" font-size="6.6" fill="#C7C4BD" text-anchor="middle" font-weight="600">IDENTIFICATION RIG</text><rect x="808.0" y="350.0" width="150.0" height="28.0" fill="#050505" stroke="#414141" stroke-width="1"/><text x="883.0" y="366.4" font-family="JetBrains Mono, ui-monospace, monospace" font-size="6.6" fill="#C7C4BD" text-anchor="middle" font-weight="600">TWIN ARCHITECTURE</text><rect x="650.0" y="384.0" width="150.0" height="28.0" fill="#050505" stroke="#414141" stroke-width="1"/><text x="725.0" y="400.4" font-family="JetBrains Mono, ui-monospace, monospace" font-size="6.6" fill="#C7C4BD" text-anchor="middle" font-weight="600">TRAINING PIPELINE</text><rect x="808.0" y="384.0" width="150.0" height="28.0" fill="#050505" stroke="#414141" stroke-width="1"/><text x="883.0" y="400.4" font-family="JetBrains Mono, ui-monospace, monospace" font-size="6.6" fill="#C7C4BD" text-anchor="middle" font-weight="600">EVIDENCE PACKAGES</text><rect x="650.0" y="418.0" width="150.0" height="28.0" fill="#050505" stroke="#414141" stroke-width="1"/><text x="725.0" y="434.4" font-family="JetBrains Mono, ui-monospace, monospace" font-size="6.6" fill="#C7C4BD" text-anchor="middle" font-weight="600">TEAM KNOWLEDGE</text><text x="650.0" y="462.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.5" fill="#A19E97">The network weights are per-airframe. The pipeline is permanent.</text></svg>