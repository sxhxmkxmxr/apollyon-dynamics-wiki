<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-label="The modelled flight against the flown flight, and the shared physics backbone every airframe is packaged on"><defs><marker id="eb-ink" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#C7C4BD"/></marker><marker id="eb-red" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#F04B4B"/></marker><marker id="eb-grey" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#414141"/></marker></defs><text x="60.0" y="46.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" letter-spacing="0.12em">ONE MANOEUVRE, REPLAYED THROUGH THE SIMULATOR</text><line x1="60.0" y1="90.0" x2="60.0" y2="330.0" stroke="#2B2B2B" stroke-width="1"/><line x1="60.0" y1="330.0" x2="580.0" y2="330.0" stroke="#2B2B2B" stroke-width="1"/><path d="M70,320 C180,300 260,270 340,220 C400,183 470,150 560,132" fill="none" stroke="#C7C4BD" stroke-width="2"/><path d="M70,324 C180,312 270,290 350,252 C420,220 480,196 560,178" fill="none" stroke="#7F7C76" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="200.0" y1="306.0" x2="200.0" y2="322.0" stroke="#F04B4B" stroke-width="2"/><line x1="300.0" y1="264.0" x2="300.0" y2="286.0" stroke="#F04B4B" stroke-width="2"/><line x1="400.0" y1="222.0" x2="400.0" y2="242.0" stroke="#F04B4B" stroke-width="2"/><line x1="490.0" y1="180.0" x2="490.0" y2="196.0" stroke="#F04B4B" stroke-width="2"/><text x="512.0" y="166.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.0" fill="#F04B4B" font-weight="700">the gap</text><line x1="150.0" y1="108.0" x2="180.0" y2="108.0" stroke="#C7C4BD" stroke-width="2"/><text x="188.0" y="112.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#A19E97">what the aircraft did</text><line x1="150.0" y1="130.0" x2="180.0" y2="130.0" stroke="#7F7C76" stroke-width="1.6" stroke-dasharray="6 5"/><text x="188.0" y="134.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#A19E97">what the model predicted</text><text x="60.0" y="368.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.5" fill="#A19E97">Every gap is traced to a term in the physics and corrected there. None of it is averaged</text><text x="60.0" y="384.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.5" fill="#A19E97">away as noise.</text><line x1="620.0" y1="30.0" x2="620.0" y2="420.0" stroke="#1D1D1D" stroke-width="1"/><text x="650.0" y="46.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" letter-spacing="0.12em">ONE BACKBONE, ONE PACKAGE PER AIRFRAME</text><rect x="650.0" y="66.0" width="96.0" height="40.0" fill="#050505" stroke="#414141" stroke-width="1"/><text x="698.0" y="88.7" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.4" fill="#C7C4BD" text-anchor="middle" font-weight="600">RESEARCH QUAD</text><line x1="698.0" y1="106.0" x2="698.0" y2="138.0" stroke="#414141" stroke-width="1.1" marker-end="url(#eb-grey)"/><rect x="755.0" y="66.0" width="96.0" height="40.0" fill="#050505" stroke="#414141" stroke-width="1"/><text x="803.0" y="88.7" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.4" fill="#C7C4BD" text-anchor="middle" font-weight="600">INTERCEPTOR</text><line x1="803.0" y1="106.0" x2="803.0" y2="138.0" stroke="#414141" stroke-width="1.1" marker-end="url(#eb-grey)"/><rect x="860.0" y="66.0" width="96.0" height="40.0" fill="#050505" stroke="#414141" stroke-width="1"/><text x="908.0" y="88.7" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.4" fill="#C7C4BD" text-anchor="middle" font-weight="600">JET</text><line x1="908.0" y1="106.0" x2="908.0" y2="138.0" stroke="#414141" stroke-width="1.1" marker-end="url(#eb-grey)"/><rect x="650.0" y="138.0" width="300.0" height="54.0" fill="#3A1212" stroke="#D92323" stroke-width="1.3"/><text x="800.0" y="163.8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#F2EFE9" text-anchor="middle" font-weight="600">SHARED PHYSICS BACKBONE</text><text x="800.0" y="175.2" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.8" fill="#7F7C76" text-anchor="middle">IDENTIFICATION · SIMULATION · TRAINING</text><line x1="800.0" y1="242.0" x2="800.0" y2="206.0" stroke="#C7C4BD" stroke-width="1.1" marker-end="url(#eb-ink)"/><rect x="650.0" y="242.0" width="300.0" height="46.0" fill="#050505" stroke="#414141" stroke-width="1"/><text x="800.0" y="268.8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#C7C4BD" text-anchor="middle" font-weight="600">MEASURED FLIGHT DATA</text><text x="650.0" y="322.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.5" fill="#A19E97">A new airframe is a new package on the same backbone,</text><text x="650.0" y="338.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.5" fill="#A19E97">not a new simulator. The next airframe starts from</text><text x="650.0" y="354.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.5" fill="#A19E97">where the last one finished.</text><line x1="60.0" y1="438.0" x2="960.0" y2="438.0" stroke="#2B2B2B" stroke-width="1"/><text x="60.0" y="464.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.0" fill="#F04B4B" font-weight="700" letter-spacing="0.12em">WHAT THE PHYSICS CORE CARRIES</text><text x="60.0" y="488.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.0" fill="#A19E97">boundary-layer separation · cross-rotor wash · transient motor heating · voltage sag under peak draw · structural vibration cross-talk</text></svg>