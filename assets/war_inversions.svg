<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="Four inversions of modern warfare and the exchange rate between interceptors and strike rounds"><defs><marker id="wi-ink" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#7F7C76"/></marker><marker id="wi-red" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#F04B4B"/></marker><marker id="wi-grey" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#414141"/></marker></defs><text x="40.0" y="30.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" letter-spacing="0.18em">THEN</text><text x="552.0" y="30.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#F04B4B" letter-spacing="0.18em">NOW</text><line x1="40.0" y1="40.0" x2="960.0" y2="40.0" stroke="#2B2B2B" stroke-width="1"/><text x="40.0" y="78.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.0" fill="#F04B4B" font-weight="700">01</text><text x="72.0" y="78.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#F2EFE9" font-weight="700" letter-spacing="0.12em">PLATFORM</text><text x="72.0" y="104.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="12.5" fill="#A19E97">Manned and exquisite. A single sortie costs more than the</text><text x="72.0" y="121.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="12.5" fill="#A19E97">target it services, and the pilot cannot be replaced.</text><line x1="72.0" y1="134.0" x2="468.0" y2="134.0" stroke="#1D1D1D" stroke-width="1"/><line x1="492.0" y1="96.0" x2="532.0" y2="96.0" stroke="#F04B4B" stroke-width="1.4" marker-end="url(#wi-red)"/><text x="552.0" y="104.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="13.0" fill="#F2EFE9" font-weight="600">Autonomous and attritable. The machine goes first, at a</text><text x="552.0" y="122.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="13.0" fill="#F2EFE9" font-weight="600">unit cost that permits it to be lost.</text><text x="40.0" y="166.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.0" fill="#F04B4B" font-weight="700">02</text><text x="72.0" y="166.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#F2EFE9" font-weight="700" letter-spacing="0.12em">INVENTORY</text><text x="72.0" y="192.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="12.5" fill="#A19E97">Stockpiles of a few hundred. A real campaign empties the</text><text x="72.0" y="209.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="12.5" fill="#A19E97">magazine within weeks.</text><line x1="72.0" y1="222.0" x2="468.0" y2="222.0" stroke="#1D1D1D" stroke-width="1"/><line x1="492.0" y1="184.0" x2="532.0" y2="184.0" stroke="#F04B4B" stroke-width="1.4" marker-end="url(#wi-red)"/><text x="552.0" y="192.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="13.0" fill="#F2EFE9" font-weight="600">Production of thousands. Output rate becomes a</text><text x="552.0" y="210.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="13.0" fill="#F2EFE9" font-weight="600">performance parameter, alongside range and speed.</text><text x="40.0" y="254.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.0" fill="#F04B4B" font-weight="700">03</text><text x="72.0" y="254.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#F2EFE9" font-weight="700" letter-spacing="0.12em">SPECTRUM</text><text x="72.0" y="280.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="12.5" fill="#A19E97">Permissive GNSS. Precision depends on satellite signals the</text><text x="72.0" y="297.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="12.5" fill="#A19E97">adversary can deny at will.</text><line x1="72.0" y1="310.0" x2="468.0" y2="310.0" stroke="#1D1D1D" stroke-width="1"/><line x1="492.0" y1="272.0" x2="532.0" y2="272.0" stroke="#F04B4B" stroke-width="1.4" marker-end="url(#wi-red)"/><text x="552.0" y="280.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="13.0" fill="#F2EFE9" font-weight="600">Contested and denied. Navigation falls back on inertial,</text><text x="552.0" y="298.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="13.0" fill="#F2EFE9" font-weight="600">terrain and optical references.</text><text x="40.0" y="342.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.0" fill="#F04B4B" font-weight="700">04</text><text x="72.0" y="342.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#F2EFE9" font-weight="700" letter-spacing="0.12em">EXCHANGE</text><text x="72.0" y="368.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="12.5" fill="#A19E97">The defender fires an ₹18–35 crore interceptor at whatever</text><text x="72.0" y="385.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="12.5" fill="#A19E97">arrives.</text><line x1="72.0" y1="398.0" x2="468.0" y2="398.0" stroke="#1D1D1D" stroke-width="1"/><line x1="492.0" y1="360.0" x2="532.0" y2="360.0" stroke="#F04B4B" stroke-width="1.4" marker-end="url(#wi-red)"/><text x="552.0" y="368.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="13.0" fill="#F2EFE9" font-weight="600">A ₹15–35 lakh strike round arrives instead. The exchange</text><text x="552.0" y="386.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="13.0" fill="#F2EFE9" font-weight="600">now bankrupts the defence.</text><line x1="40.0" y1="406.0" x2="960.0" y2="406.0" stroke="#2B2B2B" stroke-width="1"/><text x="40.0" y="424.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#F04B4B" font-weight="700" letter-spacing="0.12em">THE EXCHANGE RATE</text><rect x="40.0" y="438.0" width="9.0" height="9.0" fill="#D92323" stroke="#2B2B2B" stroke-width="1"/><rect x="40.0" y="448.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="40.0" y="458.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="40.0" y="468.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="40.0" y="478.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="40.0" y="488.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="40.0" y="498.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="40.0" y="508.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="40.0" y="518.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="40.0" y="528.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="50.0" y="438.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="50.0" y="448.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="50.0" y="458.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="50.0" y="468.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="50.0" y="478.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="50.0" y="488.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="50.0" y="498.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="50.0" y="508.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="50.0" y="518.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="50.0" y="528.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="60.0" y="438.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="60.0" y="448.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="60.0" y="458.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="60.0" y="468.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="60.0" y="478.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="60.0" y="488.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="60.0" y="498.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="60.0" y="508.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="60.0" y="518.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="60.0" y="528.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="70.0" y="438.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="70.0" y="448.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="70.0" y="458.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="70.0" y="468.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="70.0" y="478.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="70.0" y="488.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="70.0" y="498.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="70.0" y="508.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="70.0" y="518.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="70.0" y="528.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="80.0" y="438.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="80.0" y="448.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="80.0" y="458.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="80.0" y="468.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="80.0" y="478.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="80.0" y="488.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="80.0" y="498.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="80.0" y="508.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="80.0" y="518.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="80.0" y="528.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="90.0" y="438.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="90.0" y="448.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="90.0" y="458.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="90.0" y="468.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="90.0" y="478.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="90.0" y="488.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="90.0" y="498.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="90.0" y="508.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="90.0" y="518.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="90.0" y="528.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="100.0" y="438.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="100.0" y="448.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="100.0" y="458.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="100.0" y="468.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="100.0" y="478.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="100.0" y="488.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="100.0" y="498.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="100.0" y="508.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="100.0" y="518.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="100.0" y="528.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="110.0" y="438.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="110.0" y="448.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="110.0" y="458.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="110.0" y="468.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="110.0" y="478.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="110.0" y="488.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="110.0" y="498.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="110.0" y="508.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="110.0" y="518.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="110.0" y="528.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="120.0" y="438.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="120.0" y="448.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="120.0" y="458.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="120.0" y="468.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="120.0" y="478.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="120.0" y="488.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="120.0" y="498.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="120.0" y="508.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="120.0" y="518.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="120.0" y="528.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="130.0" y="438.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="130.0" y="448.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="130.0" y="458.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="130.0" y="468.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="130.0" y="478.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="130.0" y="488.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="130.0" y="498.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="130.0" y="508.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="130.0" y="518.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><rect x="130.0" y="528.0" width="9.0" height="9.0" fill="none" stroke="#2B2B2B" stroke-width="1"/><text x="170.0" y="454.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="12.5" fill="#F2EFE9" font-weight="600">= 100 attritable strike rounds</text><text x="170.0" y="476.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="11.5" fill="#A19E97">bought for the price of one air-defence interceptor. A defence built</text><text x="170.0" y="492.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="11.5" fill="#A19E97">on expensive interceptors loses the arithmetic before it loses the</text><text x="170.0" y="508.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="11.5" fill="#A19E97">battle.</text><text x="660.0" y="454.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.0" fill="#7F7C76" letter-spacing="0.1em">RATIO ≈ 50–200 : 1</text><text x="660.0" y="476.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#7F7C76">depending on the pairing. The interceptor is</text><text x="660.0" y="491.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#7F7C76">not the only party losing this exchange —</text><text x="660.0" y="506.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#7F7C76">national magazines are finite too.</text></svg>