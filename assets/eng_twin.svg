<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="The flight vehicle and its simulation twin: measured flight data identifies the physics, the twin trains the policies, the hardware-in-the-loop harness clears them for flight"><defs><marker id="et-ink" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#C7C4BD"/></marker><marker id="et-red" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#F04B4B"/></marker><marker id="et-grey" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#414141"/></marker></defs><text x="40.0" y="40.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" letter-spacing="0.13em">THE FLIGHT VEHICLE</text><rect x="40.0" y="56.0" width="430.0" height="400.0" fill="none" stroke="#414141" stroke-width="1" stroke-dasharray="4 4"/><text x="56.0" y="78.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.5" fill="#F04B4B" font-weight="700" letter-spacing="0.1em">ONE ENGINEERING METHOD, ONE PER-AIRFRAME PACKAGE</text><rect x="56.0" y="94.0" width="398.0" height="40.0" fill="#050505" stroke="#414141" stroke-width="1"/><text x="255.0" y="117.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.4" fill="#C7C4BD" text-anchor="middle" font-weight="600">MISSION SENSORS &amp; SEEKERS</text><rect x="56.0" y="140.0" width="94.0" height="34.0" fill="#050505" stroke="#414141" stroke-width="1"/><text x="103.0" y="159.4" font-family="JetBrains Mono, ui-monospace, monospace" font-size="6.8" fill="#C7C4BD" text-anchor="middle" font-weight="600">CRPA GNSS</text><rect x="156.0" y="140.0" width="94.0" height="34.0" fill="#050505" stroke="#414141" stroke-width="1"/><text x="203.0" y="159.4" font-family="JetBrains