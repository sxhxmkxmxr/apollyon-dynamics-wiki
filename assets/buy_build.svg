<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Six layers: the limit that comes with bought parts against what Apollyon builds itself"><text x="292.0" y="34.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#F04B4B" text-anchor="end" font-weight="700" letter-spacing="0.13em">THE LIMIT THAT COMES WITH THE PART</text><text x="600.0" y="34.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#F2EFE9" font-weight="700" letter-spacing="0.13em">WHAT WE BUILD OURSELVES</text><rect x="300.0" y="58.0" width="270.0" height="46.0" fill="#111111" stroke="#414141" stroke-width="1"/><text x="435.0" y="85.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.0" fill="#F2EFE9" text-anchor="middle" font-weight="600">MISSION AUTONOMY</text><text x="288.0" y="79.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.5" fill="#A19E97" text-anchor="end">behaviour you can barely change</text><line x1="296.0" y1="81.0" x2="298.0" y2="81.0" stroke="#414141" stroke-width="1"/><line x1="572.0" y1="81.0" x2="590.0" y2="81.0" stroke="#3A1212" stroke-width="1"/><rect x="300.0" y="118.0" width="270.0" height="46.0" fill="#111111" stroke="#414141" stroke-width="1"/><text x="435.0" y="145.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.0" fill="#F2EFE9" text-anchor="middle" font-weight="600">GUIDANCE AND CONTROL</text><text x="288.0" y="139.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.5" fill="#A19E97" text-anchor="end">unable to adapt to aggressive autonomous</text><text x="288.0" y="153.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.5" fill="#A19E97" text-anchor="end">flight</text><line x1="296.0" y1="141.0" x2="298.0" y2="141.0" stroke="#414141" stroke-width="1"/><line x1="572.0" y1="141.0" x2="590.0" y2="141.0" stroke="#3A1212" stroke-width="1"/><rect x="300.0" y="178.0" width="270.0" height="46.0" fill="#111111" stroke="#414141" stroke-width="1"/><text x="435.0" y="205.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.0" fill="#F2EFE9" text-anchor="middle" font-weight="600">FLIGHT SOFTWARE</text><text x="288.0" y="199.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.5" fill="#A19E97" text-anchor="end">built around a pilot, not autonomy</text><line x1="296.0" y1="201.0" x2="298.0" y2="201.0" stroke="#414141" stroke-width="1"/><line x1="572.0" y1="201.0" x2="590.0" y2="201.0" stroke="#3A1212" stroke-width="1"/><rect x="300.0" y="238.0" width="270.0" height="46.0" fill="#111111" stroke="#414141" stroke-width="1"/><text x="435.0" y="265.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.0" fill="#F2EFE9" text-anchor="middle" font-weight="600">ONBOARD COMPUTE</text><text x="288.0" y="259.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.5" fill="#A19E97" text-anchor="end">general hardware for all software</text><line x1="296.0" y1="261.0" x2="298.0" y2="261.0" stroke="#414141" stroke-width="1"/><line x1="572.0" y1="261.0" x2="590.0" y2="261.0" stroke="#3A1212" stroke-width="1"/><rect x="300.0" y="298.0" width="270.0" height="46.0" fill="#111111" stroke="#414141" stroke-width="1"/><text x="435.0" y="325.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.0" fill="#F2EFE9" text-anchor="middle" font-weight="600">AVIONICS AND POWER</text><text x="288.0" y="319.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.5" fill="#A19E97" text-anchor="end">a supplier&#x27;s safety throttle; power out of</text><text x="288.0" y="333.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.5" fill="#A19E97" text-anchor="end">reach</text><line x1="296.0" y1="321.0" x2="298.0" y2="321.0" stroke="#414141" stroke-width="1"/><line x1="572.0" y1="321.0" x2="590.0" y2="321.0" stroke="#3A1212" stroke-width="1"/><rect x="300.0" y="358.0" width="270.0" height="46.0" fill="#111111" stroke="#414141" stroke-width="1"/><text x="435.0" y="385.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.0" fill="#F2EFE9" text-anchor="middle" font-weight="600">AIRFRAME AND PROPULSION</text><text x="288.0" y="379.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.5" fill="#A19E97" text-anchor="end">somebody else&#x27;s form factor</text><line x1="296.0" y1="381.0" x2="298.0" y2="381.0" stroke="#414141" stroke-width="1"/><line x1="572.0" y1="381.0" x2="590.0" y2="381.0" stroke="#3A1212" stroke-width="1"/><rect x="590.0" y="58.0" width="12.0" height="106.0" fill="#3A1212" stroke="#D92323" stroke-width="1.2"/><text x="618.0" y="107.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="11.0" fill="#C7C4BD">policies trained against our own physics</text><rect x="590.0" y="178.0" width="12.0" height="106.0" fill="#3A1212" stroke="#D92323" stroke-width="1.2"/><text x="618.0" y="227.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="11.0" fill="#C7C4BD">a cycle time we can state and hold</text><rect x="590.0" y="298.0" width="12.0" height="46.0" fill="#3A1212" stroke="#D92323" stroke-width="1.2"/><text x="618.0" y="317.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="11.0" fill="#C7C4BD">the true power envelope, measured at the cell</text><rect x="590.0" y="358.0" width="12.0" height="46.0" fill="#3A1212" stroke="#D92323" stroke-width="1.2"/><text x="618.0" y="377.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="11.0" fill="#C7C4BD">structures designed around the mission, not a catalogue</text><line x1="40.0" y1="470.0" x2="960.0" y2="470.0" stroke="#2B2B2B" stroke-width="1"/><text x="40.0" y="502.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="12.5" fill="#F2EFE9" font-weight="600">Depth and speed are not a trade.</text><text x="40.0" y="524.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="12.5" fill="#F2EFE9" font-weight="600">Owning a layer is the reason the next iteration is perfected fast.</text></svg>