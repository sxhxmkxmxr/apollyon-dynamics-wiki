<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="auto">
<rect width="1200" height="800" fill="#060606"/>
<text x="48" y="52" fill="#D92323" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" letter-spacing="0.08em">MODERN WARFARE</text>
<line x1="48" y1="64" x2="96" y2="64" stroke="#D92323" stroke-width="2.5"/>
<text x="48" y="118" fill="#F2EFE9" font-family="Inter, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.025em">The war changed shape.</text>
<text x="48" y="148" fill="#8A8781" font-family="Inter, sans-serif" font-size="15">Three inversions observed in Ukraine, the Red Sea, and Nagorno-Karabakh. Each row reads past → present.</text>
<line x1="48" y1="190" x2="1152" y2="190" stroke="#1E1E1E" stroke-width="1"/>
<text x="48" y="226" fill="#5A5854" font-family="JetBrains Mono, monospace" font-size="12">01</text>
<text x="48" y="258" fill="#F2EFE9" font-family="Inter, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.02em">MANNED → TELE-OPERATED → AUTONOMOUS</text>
<text x="48" y="284" fill="#8A8781" font-family="Inter, sans-serif" font-size="14">Pilots and $80M jets give way to RF-fragile FPVs, then to edge-AI weapons that fly with zero link.</text>
<text x="1152" y="226" fill="#D92323" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" text-anchor="end">EDGE-AI</text>
<line x1="48" y1="312" x2="1152" y2="312" stroke="#1E1E1E" stroke-width="1"/>
<text x="48" y="348" fill="#5A5854" font-family="JetBrains Mono, monospace" font-size="12">02</text>
<text x="48" y="380" fill="#F2EFE9" font-family="Inter, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.02em">SCARCE → DISPOSABLE → ATTRITABLE</text>
<text x="48" y="406" fill="#8A8781" font-family="Inter, sans-serif" font-size="14">18-month prime backlogs lose to automotive-cadence salvo production measured in thousands/month.</text>
<text x="1152" y="348" fill="#D92323" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" text-anchor="end">MASS</text>
<line x1="48" y1="434" x2="1152" y2="434" stroke="#1E1E1E" stroke-width="1"/>
<text x="48" y="470" fill="#5A5854" font-family="JetBrains Mono, monospace" font-size="12">03</text>
<text x="48" y="502" fill="#F2EFE9" font-family="Inter, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.02em">PERMISSIVE → JAMMED → DENIED</text>
<text x="48" y="528" fill="#8A8781" font-family="Inter, sans-serif" font-size="14">A jammer every ~10 km on the FLOT. >80% of GNSS denied. Only onboard autonomy reaches target.</text>
<text x="1152" y="470" fill="#D92323" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" text-anchor="end">DENIED</text>
<line x1="48" y1="562" x2="1152" y2="562" stroke="#1E1E1E" stroke-width="1"/>
<text x="48" y="594" fill="#D92323" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">COST ASYMMETRY · THE 1:100 TRAP</text>
<text x="48" y="614" fill="#8A8781" font-family="JetBrains Mono, monospace" font-size="11">ATTRITABLE STRIKE · SHAHED / NIGHTSHADE CLASS</text>
<rect x="48" y="624" width="180" height="14" fill="#F2EFE9"/>
<text x="48" y="666" fill="#F2EFE9" font-family="Inter, sans-serif" font-size="30" font-weight="800">&lt; ₹2 CRORE</text>
<text x="280" y="666" fill="#8A8781" font-family="Inter, sans-serif" font-size="14">&lt; $250k · 1,000s per month</text>
<text x="48" y="690" fill="#8A8781" font-family="JetBrains Mono, monospace" font-size="11">LEGACY INTERCEPTOR · PATRIOT / SM-2 / ASTER CLASS</text>
<rect x="48" y="700" width="880" height="14" fill="none" stroke="#D92323" stroke-width="1.5"/>
<rect x="48" y="700" width="880" height="14" fill="#D92323" opacity="0.25"/>
<text x="48" y="742" fill="#E83131" font-family="Inter, sans-serif" font-size="30" font-weight="800">₹18–35 CRORE</text>
<text x="300" y="742" fill="#8A8781" font-family="Inter, sans-serif" font-size="14">$2–4M · 18–36 month lead time</text>
<text x="1152" y="666" fill="#5A5854" font-family="JetBrains Mono, monospace" font-size="11" text-anchor="end">SOURCE: RUSI / CSIS · APOLLYON EST.</text>
</svg>