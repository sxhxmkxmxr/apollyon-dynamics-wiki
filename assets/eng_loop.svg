<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="One instrumented flight returns changes to the simulator, the runtime, the control policies and the hardware, then the next aircraft flies"><defs><marker id="el-ink" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#C7C4BD"/></marker><marker id="el-red" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#F04B4B"/></marker><marker id="el-grey" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#414141"/></marker></defs><rect x="120.0" y="30.0" width="400.0" height="54.0" fill="#3A1212" stroke="#D92323" stroke-width="1.3"/><text x="320.0" y="56.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#F2EFE9" text-anchor="middle" font-weight="600">FLIGHT AT THE EDGE</text><text x="320.0" y="67.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.6" fill="#7F7C76" text-anchor="middle">INSTRUMENTED FOR CURRENT · BUS LATENCY · ACCELERATION</text><line x1="320.0" y1="84.0" x2="320.0" y2="112.0" stroke="#C7C4BD" stroke-width="1.1" marker-end="url(#el-ink)"/><rect x="120.0" y="112.0" width="400.0" height="50.0" fill="#050505" stroke="#414141" stroke-width="1"/><text x="320.0" y="135.3" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.2" fill="#C7C4BD" text-anchor="middle" font-weight="600">MISMATCH &amp; ANOMALY ANALYSIS</text><text x="320.0" y="146.4" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.6" fill="#7F7C76" text-anchor="middle">INGESTED WITHIN HOURS, READ AGAINST WHAT WAS PREDICTED</text><line x1="110.0" y1="162.0" x2="110.0" y2="192.0" stroke="#414141" stroke-width="1.1" marker-end="url(#el-grey)"/><line x1="250.0" y1="162.0" x2="250.0" y2="192.0" stroke="#414141" stroke-width="1.1" marker-end="url(#el-grey)"/><line x1="390.0" y1="162.0" x2="390.0" y2="192.0" stroke="#414141" stroke-width="1.1" marker-end="url(#el-grey)"/><line x1="530.0" y1="162.0" x2="530.0" y2="192.0" stroke="#414141" stroke-width="1.1" marker-end="url(#el-grey)"/><rect x="40.0" y="192.0" width="140.0" height="88.0" fill="#050505" stroke="#414141" stroke-width="1"/><text x="110.0" y="229.3" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.2" fill="#C7C4BD" text-anchor="middle" font-weight="600">SIMULATOR PHYSICS</text><text x="110.0" y="239.8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.0" fill="#7F7C76" text-anchor="middle">AERO AND</text><text x="110.0" y="249.3" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.0" fill="#7F7C76" text-anchor="middle">COMPONENT MODELS CORRECTED</text><rect x="187.0" y="192.0" width="140.0" height="88.0" fill="#050505" stroke="#414141" stroke-width="1"/><text x="257.0" y="229.3" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.2" fill="#C7C4BD" text-anchor="middle" font-weight="600">ONBOARD RUNTIME</text><text x="257.0" y="239.8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.0" fill="#7F7C76" text-anchor="middle">KERNEL TIMING</text><text x="257.0" y="249.3" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.0" fill="#7F7C76" text-anchor="middle">CHECKED AGAINST REAL TRACES</text><rect x="334.0" y="192.0" width="140.0" height="88.0" fill="#050505" stroke="#414141" stroke-width="1"/><text x="404.0" y="234.1" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.2" fill="#C7C4BD" text-anchor="middle" font-weight="600">CONTROL POLICIES</text><text x="404.0" y="244.2" font-family="JetBrains Mono, ui-monospace, monospace" font-size="6.6" fill="#7F7C76" text-anchor="middle">RETRAINED ON THE NEW BOUNDARY</text><rect x="481.0" y="192.0" width="140.0" height="88.0" fill="#050505" stroke="#414141" stroke-width="1"/><text x="551.0" y="229.3" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.2" fill="#C7C4BD" text-anchor="middle" font-weight="600">HARDWARE SPEC</text><text x="551.0" y="239.8" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.0" fill="#7F7C76" text-anchor="middle">NEXT AVIONICS,</text><text x="551.0" y="249.3" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.0" fill="#7F7C76" text-anchor="middle">POWER AND THERMAL PATH</text><line x1="110.0" y1="280.0" x2="110.0" y2="306.0" stroke="#2B2B2B" stroke-width="1"/><line x1="257.0" y1="280.0" x2="257.0" y2="306.0" stroke="#2B2B2B" stroke-width="1"/><line x1="404.0" y1="280.0" x2="404.0" y2="306.0" stroke="#2B2B2B" stroke-width="1"/><line x1="551.0" y1="280.0" x2="551.0" y2="306.0" stroke="#2B2B2B" stroke-width="1"/><line x1="110.0" y1="306.0" x2="551.0" y2="306.0" stroke="#2B2B2B" stroke-width="1"/><line x1="320.0" y1="306.0" x2="320.0" y2="336.0" stroke="#C7C4BD" stroke-width="1.1" marker-end="url(#el-ink)"/><rect x="120.0" y="336.0" width="400.0" height="54.0" fill="#3A1212" stroke="#D92323" stroke-width="1.3"/><text x="320.0" y="361.4" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.5" fill="#F2EFE9" text-anchor="middle" font-weight="600">THE NEXT AIRCRAFT</text><text x="320.0" y="373.6" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.6" fill="#7F7C76" text-anchor="middle">FLOWN SOONER, FLOWN FASTER, WITH MORE MARGIN</text><line x1="120.0" y1="363.0" x2="60.0" y2="363.0" stroke="#2B2B2B" stroke-width="1"/><line x1="60.0" y1="363.0" x2="60.0" y2="57.0" stroke="#2B2B2B" stroke-width="1"/><line x1="60.0" y1="57.0" x2="120.0" y2="57.0" stroke="#C7C4BD" stroke-width="1.1" marker-end="url(#el-ink)"/><text x="64.0" y="410.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" letter-spacing="0.1em">ONE PASS HAPPENS WITHIN DAYS</text><line x1="640.0" y1="30.0" x2="640.0" y2="470.0" stroke="#1D1D1D" stroke-width="1"/><text x="668.0" y="46.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#F04B4B" font-weight="700" letter-spacing="0.13em">WHAT ONE SORTIE RETURNS</text><rect x="668.0" y="77.0" width="8.0" height="8.0" fill="#3A1212" stroke="#D92323" stroke-width="1"/><text x="686.0" y="86.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.5" fill="#C7C4BD">a motor slew nobody predicted</text><text x="960.0" y="102.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.8" fill="#F04B4B" text-anchor="end" letter-spacing="0.08em">SIMULATOR</text><rect x="668.0" y="135.0" width="8.0" height="8.0" fill="#3A1212" stroke="#D92323" stroke-width="1"/><text x="686.0" y="144.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.5" fill="#C7C4BD">acceleration that does not match the command</text><text x="960.0" y="160.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.8" fill="#F04B4B" text-anchor="end" letter-spacing="0.08em">CONTROL POLICY</text><rect x="668.0" y="193.0" width="8.0" height="8.0" fill="#3A1212" stroke="#D92323" stroke-width="1"/><text x="686.0" y="202.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.5" fill="#C7C4BD">a latency spike on the compute bus</text><text x="960.0" y="218.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.8" fill="#F04B4B" text-anchor="end" letter-spacing="0.08em">ONBOARD RUNTIME</text><rect x="668.0" y="251.0" width="8.0" height="8.0" fill="#3A1212" stroke="#D92323" stroke-width="1"/><text x="686.0" y="260.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.5" fill="#C7C4BD">battery heat rising earlier than modelled</text><text x="960.0" y="276.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8.8" fill="#F04B4B" text-anchor="end" letter-spacing="0.08em">HARDWARE REVISION</text><line x1="668.0" y1="330.0" x2="960.0" y2="330.0" stroke="#2B2B2B" stroke-width="1"/><text x="668.0" y="356.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#F04B4B" font-weight="700" letter-spacing="0.13em">WHY EACH PASS COSTS LESS</text><text x="668.0" y="382.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.5" fill="#A19E97">The instrumentation, ingest pipeline and test</text><text x="668.0" y="398.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.5" fill="#A19E97">harness are built once. Every campaign after that</text><text x="668.0" y="414.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.5" fill="#A19E97">costs less and returns more — capability that stays</text><text x="668.0" y="430.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.5" fill="#A19E97">with the company.</text><text x="668.0" y="452.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="11.0" fill="#F2EFE9" font-weight="600">None of this can be bought in.</text><text x="668.0" y="470.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="11.0" fill="#F2EFE9" font-weight="600">It accumulates only at the rate we fly.</text></svg>