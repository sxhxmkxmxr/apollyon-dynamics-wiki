<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-label="Distance flown while one control cycle runs: a conventional stack against the Apollyon stack"><text x="190.0" y="34.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" letter-spacing="0.12em">DISTANCE FLOWN WHILE ONE CONTROL CYCLE RUNS</text><line x1="190.0" y1="52.0" x2="190.0" y2="342.0" stroke="#1D1D1D" stroke-width="1"/><text x="190.0" y="364.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" text-anchor="middle">0.0 m</text><line x1="377.5" y1="52.0" x2="377.5" y2="342.0" stroke="#1D1D1D" stroke-width="1"/><text x="377.5" y="364.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" text-anchor="middle">0.5 m</text><line x1="565.0" y1="52.0" x2="565.0" y2="342.0" stroke="#1D1D1D" stroke-width="1"/><text x="565.0" y="364.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" text-anchor="middle">1.0 m</text><line x1="752.5" y1="52.0" x2="752.5" y2="342.0" stroke="#1D1D1D" stroke-width="1"/><text x="752.5" y="364.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" text-anchor="middle">1.5 m</text><line x1="940.0" y1="52.0" x2="940.0" y2="342.0" stroke="#1D1D1D" stroke-width="1"/><text x="940.0" y="364.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" text-anchor="middle">2.0 m</text><text x="180.0" y="96.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10.0" fill="#A19E97" text-anchor="end" font-weight="700">A CONVENTIONAL STACK</text><rect x="190.0" y="76.0" width="180.0" height="44.0" fill="#161616" stroke="#2B2B2B" stroke-width="1"/><rect x="370.0" y="76.0" width="142.5" height="44.0" fill="#1E1E1E" stroke="#2B2B2B" stroke-width="1"/><rect x="512.5" y="76.0" width="180.0" height="44.0" fill="#282828" stroke="#2B2B2B" stroke-width="1"/><rect x="692.5" y="76.0" width="97.5" height="44.0" fill="#333333" stroke="#2B2B2B" stroke-width="1"/><rect x="790.0" y="76.0" width="112.5" height="44.0" fill="none" stroke="#3A1212" stroke-width="1" stroke-dasharray="4 3"/><text x="280.0" y="140.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" text-anchor="middle">copies through user space</text><text x="441.2" y="140.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" text-anchor="middle">runtime overhead</text><text x="602.5" y="140.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" text-anchor="middle">inference</text><text x="741.2" y="140.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" text-anchor="middle">actuate</text><text x="846.2" y="140.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#F04B4B" text-anchor="middle">jitter — the cycle</text><text x="846.2" y="154.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#F04B4B" text-anchor="middle">that misses</text><text x="896.5" y="68.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5" fill="#F04B4B" text-anchor="end" font-weight="700">1.9 m of flight</text><text x="180.0" y="240.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.0" fill="#F2EFE9" text-anchor="end" font-weight="700">OURS</text><rect x="190.0" y="220.0" width="93.8" height="44.0" fill="#3A1212" stroke="#F2EFE9" stroke-width="1"/><text x="236.9" y="292.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5" fill="#F2EFE9" text-anchor="middle" font-weight="700">0.25 m</text><rect x="287.8" y="220.0" width="652.2" height="44.0" fill="none" stroke="#2B2B2B" stroke-width="1" stroke-dasharray="4 4"/><text x="303.8" y="238.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="11.0" fill="#A19E97">everything after this point is margin — time to react rather than time to compute</text><line x1="60.0" y1="400.0" x2="960.0" y2="400.0" stroke="#2B2B2B" stroke-width="1"/><rect x="60.0" y="409.0" width="8.0" height="8.0" fill="#3A1212" stroke="#D92323" stroke-width="1"/><text x="76.0" y="420.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#C7C4BD" font-weight="700">FUSED KERNELS</text><text x="76.0" y="438.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76">no allocation, no launch overhead</text><rect x="366.0" y="409.0" width="8.0" height="8.0" fill="#3A1212" stroke="#D92323" stroke-width="1"/><text x="382.0" y="420.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#C7C4BD" font-weight="700">REAL-TIME KERNEL</text><text x="382.0" y="438.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76">isolated cores, nothing preempts the loop</text><rect x="672.0" y="409.0" width="8.0" height="8.0" fill="#3A1212" stroke="#D92323" stroke-width="1"/><text x="688.0" y="420.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#C7C4BD" font-weight="700">ZERO-COPY PATH</text><text x="688.0" y="438.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76">sensors write straight into GPU memory</text></svg>