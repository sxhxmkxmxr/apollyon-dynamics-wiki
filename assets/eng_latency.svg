<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-label="Distance travelled between perception updates at 20, 30 and 60 hertz on a vehicle flying at Mach 0.8"><text x="60.0" y="34.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" letter-spacing="0.12em">DISTANCE TRAVELLED BETWEEN PERCEPTION UPDATES</text><text x="60.0" y="54.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#A19E97" letter-spacing="0.08em">AT MACH 0.8 · 270 M/S</text><line x1="320.0" y1="80.0" x2="320.0" y2="340.0" stroke="#1D1D1D" stroke-width="1"/><text x="320.0" y="362.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" text-anchor="middle">0 m</text><line x1="534.8" y1="80.0" x2="534.8" y2="340.0" stroke="#1D1D1D" stroke-width="1"/><text x="534.8" y="362.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" text-anchor="middle">5 m</text><line x1="749.6" y1="80.0" x2="749.6" y2="340.0" stroke="#1D1D1D" stroke-width="1"/><text x="749.6" y="362.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" text-anchor="middle">10 m</text><line x1="900.0" y1="80.0" x2="900.0" y2="340.0" stroke="#1D1D1D" stroke-width="1"/><text x="900.0" y="362.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#7F7C76" text-anchor="middle">13.5 m</text><text x="302.0" y="137.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#A19E97" text-anchor="end" font-weight="700">20 HZ · TERRAIN MATCHING</text><rect x="320.0" y="104.0" width="580.0" height="56.0" fill="#3A1212" stroke="#D92323" stroke-width="1"/><text x="912.0" y="138.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5" fill="#F2EFE9" font-weight="700">13.5 m</text><text x="302.0" y="215.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#A19E97" text-anchor="end" font-weight="700">30 HZ · EO/IR DETECTION</text><rect x="320.0" y="182.0" width="386.7" height="56.0" fill="#3A1212" stroke="#D92323" stroke-width="1"/><text x="718.7" y="216.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5" fill="#F2EFE9" font-weight="700">9.0 m</text><text x="302.0" y="293.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" fill="#A19E97" text-anchor="end" font-weight="700">60 HZ · TERMINAL TRACKING</text><rect x="320.0" y="260.0" width="193.3" height="56.0" fill="#3A1212" stroke="#D92323" stroke-width="1"/><text x="525.3" y="294.0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11.5" fill="#F2EFE9" font-weight="700">4.5 m</text><line x1="60.0" y1="400.0" x2="960.0" y2="400.0" stroke="#2B2B2B" stroke-width="1"/><text x="60.0" y="424.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.0" fill="#A19E97">The flight-critical loop runs on its own schedule and never waits for these updates.</text><text x="60.0" y="442.0" font-family="Inter, Helvetica Neue, sans-serif" font-size="10.0" fill="#7F7C76">Perception feeds it; in between, the core keeps flying on its own estimate.</text></svg>