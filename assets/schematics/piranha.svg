<?xml version="1.0" encoding="UTF-8"?>
<!-- Copied from products/usv-strike.html ("CAD schematic of Piranha USV"). Edit both together. -->
<svg viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CAD schematic of Piranha USV">
        <defs>
          <pattern id="cad_grid_usv" width="20" height="20" patternUnits="userSpaceOnUse">
            <line x1="0" y1="0" x2="20" y2="0" stroke="rgba(199,196,189,0.05)" stroke-width="1"/>
            <line x1="0" y1="0" x2="0" y2="20" stroke="rgba(199,196,189,0.05)" stroke-width="1"/>
          </pattern>
          <pattern id="hatch_wh_usv" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="6" stroke="#D92323" stroke-width="1" opacity="0.4"/>
          </pattern>
          <pattern id="hatch_fuel_usv" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
            <line x1="0" y1="0" x2="0" y2="6" stroke="#C7C4BD" stroke-width="1" opacity="0.3"/>
          </pattern>
        </defs>

        <rect width="960" height="300" fill="#0A0A0A"/>
        <rect width="960" height="300" fill="url(#cad_grid_usv)"/>

        <!-- Centerline Datum -->
        <line x1="40" y1="150" x2="920" y2="150" stroke="#C7C4BD" stroke-width="0.8" stroke-dasharray="12,4,2,4" opacity="0.6"/>
        <text x="45" y="142" fill="#C7C4BD" font-family="JetBrains Mono, monospace" font-size="8" opacity="0.7">DATUM CL / KEEL CENTERLINE</text>

        <!-- Hull Contour (Stealth Faceted Wave-Piercing Monohull) -->
        <path d="M 80 150 L 140 100 L 320 85 L 680 90 L 880 105 L 880 195 L 680 210 L 320 215 L 140 200 Z" fill="none" stroke="#F2EFE9" stroke-width="1.8"/>

        <!-- Internal Chine & Deck Facets -->
        <path d="M 80 150 L 160 120 L 340 105 L 680 108 L 870 120" fill="none" stroke="#7F7C76" stroke-width="0.9" stroke-dasharray="3,2"/>
        <path d="M 80 150 L 160 180 L 340 195 L 680 192 L 870 180" fill="none" stroke="#7F7C76" stroke-width="0.9" stroke-dasharray="3,2"/>

        <!-- Transom Flat -->
        <line x1="880" y1="105" x2="880" y2="195" stroke="#C7C4BD" stroke-width="2"/>

        <!-- Bulkhead Lines (Watertight Subdivisions) -->
        <line x1="130" y1="102" x2="130" y2="198" stroke="#C7C4BD" stroke-width="1.2" stroke-dasharray="2,2"/>
        
        <!-- Warhead Compartment: STA 0500-1800 (x=130 to x=320) -->
        <rect x="135" y="105" width="180" height="90" fill="url(#hatch_wh_usv)" stroke="#D92323" stroke-width="1.2" rx="4"/>
        <text x="225" y="146" fill="#D92323" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" text-anchor="middle">HE WARHEAD</text>
        <text x="225" y="160" fill="#D92323" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">50 KG+ CLASS · STRIKE ONLY</text>

        <!-- Midship Bulkhead: x=320 -->
        <line x1="320" y1="85" x2="320" y2="215" stroke="#C7C4BD" stroke-width="1.5"/>

        <!-- Avionics, Compute & Optical Mast Bay: STA 1800-2800 (x=320 to x=460) -->
        <rect x="325" y="100" width="130" height="100" fill="rgba(199,196,189,0.05)" stroke="#C7C4BD" stroke-width="1"/>
        <!-- EO/MWIR Mast -->
        <circle cx="370" cy="150" r="14" fill="#0A0A0A" stroke="#C7C4BD" stroke-width="1.5"/>
        <circle cx="370" cy="150" r="8" fill="#C7C4BD" opacity="0.4"/>
        <text x="370" y="153" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="7" font-weight="700" text-anchor="middle">EO/IR</text>
        <!-- Edge Compute Unit -->
        <rect x="400" y="130" width="45" height="40" fill="none" stroke="#F2EFE9" stroke-width="1"/>
        <text x="422" y="153" fill="#F2EFE9" font-family="JetBrains Mono, monospace" font-size="6.5" font-weight="700" text-anchor="middle">RADAR</text>

        <!-- Fuel Bay (Baffled Self-Sealing Diesel Cells): STA 2800-4200 (x=460 to x=640) -->
        <line x1="460" y1="88" x2="460" y2="212" stroke="#C7C4BD" stroke-width="1.5"/>
        <rect x="465" y="94" width="170" height="112" fill="url(#hatch_fuel_usv)" stroke="#C7C4BD" stroke-width="1.2" rx="3"/>
        <line x1="550" y1="94" x2="550" y2="206" stroke="#C7C4BD" stroke-width="0.8" stroke-dasharray="4,2"/>
        <text x="550" y="146" fill="#C7C4BD" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" text-anchor="middle">FUEL CELL</text>
        <text x="550" y="160" fill="#C7C4BD" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">RANGE 150–250 KM · DESIGN TARGET</text>

        <!-- Engine Room Bulkhead: x=640 -->
        <line x1="640" y1="90" x2="640" y2="210" stroke="#C7C4BD" stroke-width="1.5"/>

        <!-- Turbo-Diesel Engine: STA 4200-5200 (x=640 to x=790) -->
        <rect x="650" y="115" width="135" height="70" fill="rgba(161,158,151,0.07)" stroke="#A19E97" stroke-width="1.2" rx="2"/>
        <text x="717" y="146" fill="#A19E97" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" text-anchor="middle">MARINE ENGINE · 60–90 HP</text>
        <text x="717" y="160" fill="#A19E97" font-family="JetBrains Mono, monospace" font-size="7.5" text-anchor="middle">ENCLOSED ENGINE BAY</text>

        <!-- Driveshaft & Waterjet Bay: STA 5200-5800 (x=790 to x=880) -->
        <line x1="790" y1="95" x2="790" y2="205" stroke="#C7C4BD" stroke-width="1.2"/>
        <!-- Waterjets -->
        <rect x="840" y="118" width="50" height="26" fill="#141414" stroke="#C7C4BD" stroke-width="1.2"/>
        <rect x="840" y="156" width="50" height="26" fill="#141414" stroke="#C7C4BD" stroke-width="1.2"/>
        <path d="M 890 120 L 920 124 L 920 138 L 890 142 Z" fill="rgba(199,196,189,0.15)" stroke="#C7C4BD" stroke-width="1"/>
        <path d="M 890 158 L 920 162 L 920 176 L 890 180 Z" fill="rgba(199,196,189,0.15)" stroke="#C7C4BD" stroke-width="1"/>
        <text x="895" y="110" fill="#C7C4BD" font-family="JetBrains Mono, monospace" font-size="7.5">WATERJET</text>

        <!-- Station Lines & Callouts -->
        <g stroke="#C7C4BD" stroke-width="0.7" opacity="0.6">
          <line x1="80" y1="40" x2="80" y2="85"/>
          <line x1="130" y1="40" x2="130" y2="85"/>
          <line x1="320" y1="40" x2="320" y2="85"/>
          <line x1="460" y1="40" x2="460" y2="85"/>
          <line x1="640" y1="40" x2="640" y2="85"/>
          <line x1="880" y1="40" x2="880" y2="85"/>
        </g>
        <g fill="#C7C4BD" font-family="JetBrains Mono, monospace" font-size="7.5" opacity="0.8">
          <text x="80" y="35" text-anchor="middle">STA 0000</text>
          <text x="130" y="35" text-anchor="middle">STA 0400</text>
          <text x="320" y="35" text-anchor="middle">STA 1300</text>
          <text x="460" y="35" text-anchor="middle">STA 2000</text>
          <text x="640" y="35" text-anchor="middle">STA 3000</text>
          <text x="880" y="35" text-anchor="middle">STA 4200</text>
        </g>

        <!-- Dimension arrows below -->
        <g stroke="#7F7C76" stroke-width="0.8">
          <line x1="80" y1="260" x2="880" y2="260"/>
          <line x1="80" y1="255" x2="80" y2="265"/>
          <line x1="880" y1="255" x2="880" y2="265"/>
        </g>
        <text x="480" y="275" fill="#F2EFE9" font-family="JetBrains Mono, monospace" font-size="9" text-anchor="middle">OVERALL LENGTH: ~4,200 MM · BEAM: ~1,100 MM · DEPTH: ~700 MM</text>
      </svg>
